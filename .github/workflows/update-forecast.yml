name: Update forecast data

on:
  schedule:
    - cron: "15 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build forecast JSON
        run: python scripts/build_forecast.py

      - name: Commit forecast data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update forecast data
          file_pattern: data/forecast.json
